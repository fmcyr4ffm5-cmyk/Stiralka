<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8f8ff">
<link rel="manifest" href="./manifest.json">
<title>Стиралка ALAZANA</title>

<style>
:root{
  --sky:#e9f8ff;
  --blue:#36b8ff;
  --deep:#087ec4;
  --ink:#12425f;
  --muted:#7195aa;
  --green:#18b86d;
  --red:#ef5350;
  --gold:#ffb62e;
  --glass:rgba(255,255,255,.78);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 3%,#fff,transparent 27%),
    radial-gradient(circle at 90% 15%,#ccefff,transparent 36%),
    linear-gradient(180deg,#e6f7ff,#fbfeff 55%,#eaf9ff);
}

.sky{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.cloud{
  position:absolute;
  opacity:.48;
  animation:cloud linear infinite;
}

.cloud:nth-child(1){top:6%;font-size:68px;animation-duration:30s}
.cloud:nth-child(2){top:35%;font-size:45px;animation-duration:43s;animation-delay:-17s}
.cloud:nth-child(3){top:72%;font-size:58px;animation-duration:50s;animation-delay:-9s}

@keyframes cloud{
  from{transform:translateX(-150px)}
  to{transform:translateX(calc(100vw + 200px))}
}

.wrap{
  width:min(680px,100%);
  margin:auto;
  padding:18px 14px 70px;
}

.hero{
  text-align:center;
  margin:7px 0 17px;
}

.logo{
  font-size:31px;
  font-weight:950;
  letter-spacing:-1px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.circus{
  display:flex;
  justify-content:center;
  gap:9px;
  font-size:23px;
  margin-top:9px;
}

.circus span{
  animation:float 3s ease-in-out infinite;
}

.circus span:nth-child(2){animation-delay:-.7s}
.circus span:nth-child(3){animation-delay:-1.4s}
.circus span:nth-child(4){animation-delay:-2s}
.circus span:nth-child(5){animation-delay:-2.6s}

@keyframes float{
  50%{transform:translateY(-5px)}
}

.card{
  position:relative;
  overflow:hidden;
  margin-bottom:15px;
  padding:21px;
  border-radius:28px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(18px);
  box-shadow:
    0 18px 50px rgba(42,145,200,.14),
    inset 0 1px #fff;
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
}

.busy .dot{
  background:var(--red);
  box-shadow:0 0 14px var(--red);
}

.freeText{color:var(--green)}
.busyText{color:var(--red)}

.machine{
  width:190px;
  height:190px;
  margin:7px auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(
      #38b9ff calc(var(--progress,0)*1%),
      rgba(53,174,231,.13) 0
    );
  transition:.7s;
}

.ring:after{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  background:linear-gradient(145deg,#fff,#e4f7ff);
}

.drum{
  z-index:2;
  width:143px;
  height:143px;
  overflow:hidden;
  position:relative;
  border-radius:50%;
  border:8px solid rgba(49,174,232,.3);
  background:
    radial-gradient(circle at 30% 25%,#e0f8ff,#80d8ff 38%,#249bd6 73%,#0b6da8);
  box-shadow:
    inset 0 0 24px rgba(0,72,110,.2),
    0 12px 30px rgba(37,157,215,.2);
}

.water{
  position:absolute;
  width:125%;
  height:58%;
  left:-12%;
  bottom:-16%;
  border-radius:45%;
  background:rgba(186,238,255,.72);
  animation:water 3s ease-in-out infinite;
}

@keyframes water{
  50%{transform:rotate(6deg) translateY(-5px)}
}

.clothes{
  position:absolute;
  inset:0;
  font-size:30px;
}

.clothes.spin{
  animation:spin 4s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.item{position:absolute}
.shirt{left:29px;top:25px;transform:rotate(-17deg)}
.pants{right:24px;top:42px;transform:rotate(17deg)}
.sock{left:43px;bottom:24px}
.towel{right:28px;bottom:19px;font-size:23px}

.bubble{
  position:absolute;
  bottom:-15px;
  border-radius:50%;
  background:rgba(255,255,255,.8);
  animation:bubble 3.2s infinite;
}

.b1{width:13px;height:13px;left:17px}
.b2{width:8px;height:8px;left:53px;animation-delay:-1s}
.b3{width:18px;height:18px;right:22px;animation-delay:-2s}

@keyframes bubble{
  from{opacity:0;transform:translateY(0)}
  25%{opacity:1}
  to{opacity:0;transform:translateY(-125px)}
}

.userTitle{
  text-align:center;
  font-size:22px;
  font-weight:950;
  color:#096aa6;
}

.timer{
  font-size:49px;
  font-weight:950;
  text-align:center;
  font-variant-numeric:tabular-nums;
  letter-spacing:-1px;
}

.progressText{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:12px;
}

.speech{
  min-height:73px;
  margin-top:11px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.4;
  border-radius:19px;
  background:linear-gradient(145deg,#fff,#eaf9ff);
  border:1px solid rgba(47,174,232,.15);
  color:#266889;
  animation:pop .3s ease;
}

@keyframes pop{
  from{opacity:0;transform:translateY(6px)}
}

.final{
  background:#fff8e9;
  color:#926012;
  border-color:#ffd18a;
}

.panic{
  color:#bb403d;
  background:#fff0ef;
  border-color:#ffaaa7;
  animation:pulse 1.15s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.015)}
}

label{
  display:block;
  color:#567b91;
  font-size:14px;
  font-weight:800;
  margin:16px 0 7px;
}

select,button{
  width:100%;
  font:inherit;
  border-radius:17px;
}

select{
  padding:14px;
  background:#fff;
  color:var(--ink);
  border:1px solid rgba(47,174,232,.2);
}

button{
  padding:15px;
  margin-top:12px;
  border:none;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,#57c7ff,#148bd8);
  box-shadow:0 9px 24px rgba(26,147,212,.2);
}

button:active{transform:scale(.985)}

.stop{
  background:linear-gradient(135deg,#ff7671,#df4440);
}

.locked{
  background:#edf6fa;
  color:#7893a4;
  box-shadow:none;
}

.notify{
  background:linear-gradient(135deg,#46c6b7,#209f91);
}

.title{
  font-size:19px;
  font-weight:900;
  color:#155f88;
  margin-bottom:13px;
}

.hidden{display:none!important}

.row{
  padding:12px 2px;
  border-bottom:1px solid rgba(45,151,207,.1);
}

.row:last-child{border-bottom:none}

.muted{
  color:var(--muted);
  font-size:13px;
}

.queueRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.place{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  margin-right:7px;
  border-radius:9px;
  background:#e3f6ff;
  color:#1477ad;
  font-weight:900;
}

.badge{
  display:inline-block;
  margin-top:5px;
  padding:5px 9px;
  border-radius:99px;
  background:#e9f8ff;
  color:#247598;
  font-size:11px;
  font-weight:800;
}

.leader{
  display:grid;
  grid-template-columns:40px 1fr auto;
  gap:10px;
  align-items:center;
}

.rank{
  width:39px;
  height:39px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e2f5ff;
  font-weight:900;
}

.xp{
  color:#1389c8;
  font-weight:900;
}

.fall{
  position:fixed;
  top:-30px;
  pointer-events:none;
  z-index:999;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(540deg);
    opacity:.6;
  }
}
</style>
</head>

/* DEVICE OWNER */

let deviceId=
  localStorage.getItem("alazanaLaundryDevice");

if(!deviceId){

  deviceId=
    "alazana_"+
    Date.now()+
    "_"+
    Math.random()
      .toString(36)
      .slice(2);

  localStorage.setItem(
    "alazanaLaundryDevice",
    deviceId
  );
}


/* PWA + NOTIFICATIONS */

let swRegistration=null;

async function registerSW(){

  if(!("serviceWorker" in navigator))
    return;

  try{

    swRegistration=
      await navigator.serviceWorker.register(
        "./sw.js"
      );

  }catch(e){
    console.log(e);
  }

}

registerSW();


async function requestNotifications(){

  if(!("Notification" in window)){

    document.getElementById("notifyStatus")
      .textContent=
      "Этот браузер не поддерживает уведомления.";

    return false;
  }


  const permission=
    await Notification.requestPermission();


  if(permission==="granted"){

    document.getElementById("notifyStatus")
      .textContent=
      "🔔 Уведомления включены.";

    return true;

  }


  document.getElementById("notifyStatus")
    .textContent=
    "Уведомления не разрешены.";

  return false;
}


document.getElementById("notifyButton")
.onclick=requestNotifications;


async function notifyOwner(wash){

  if(
    wash.ownerDeviceId !== deviceId
  ) return;


  const key=
    "notified_"+wash.startTime;


  if(localStorage.getItem(key))
    return;


  if(
    "Notification" in window &&
    Notification.permission==="granted"
  ){

    try{

      const registration=
        swRegistration ||
        await navigator.serviceWorker.ready;


      await registration.showNotification(
        "🎪 ALAZANA · Стирка закончена!",
        {
          body:
            `${wash.user}, шоу окончено. Забирай вещи, пока носки не начали новую жизнь 🧦`,
          tag:
            "wash-"+wash.startTime,
          requireInteraction:true
        }
      );


      localStorage.setItem(
        key,
        "1"
      );

    }catch(e){
      console.log(e);
    }

  }

}

"Внутри барабана событий больше, чем за кулисами."

"🤡 Даже клоуны перестали смеяться. Финал близко.",
"🦖 Динозавр требует освободить машинку.",
"⚡ Финальное напряжение!",
"🎪 ПОСЛЕДНИЙ НОМЕР!",

"Начинается цирковой чемпионат ожидания.",

"Следующие артисты готовятся к выходу."

function randomFrom(a){
  return a[Math.floor(Math.random()*a.length)];
}

function personal(name){
  return randomFrom(personTemplates)
    .replaceAll("{name}",name);
}


/* AWARDS */

const awardNames=[
"Чистый носок",
"Друг порошка",
"Укротитель барабана",
"Спасатель трусишек",
"Повелитель футболки",
"Магистр пены",
"Барон свежести",
"Император центрифуги",
"Легенда белья",
"Владыка чистоты"
];

const awardEmoji=[
"🧦","🫧","🌀","🩲","👕",
"🧼","✨","🎪","🏆","👑"
];


function awardFor(n){

  if(n>=100)
    return{
      emoji:"👑",
      name:"СУПЕР-БОСС СТИРКИ",
      desc:"100 стирок. Барабан склоняется перед тобой."
    };


  const level=Math.max(1,n);

  return{
    emoji:awardEmoji[(level-1)%10],
    name:
      awardNames[(level-1)%10]+
      " · уровень "+level,
    desc:
      `Награда №${level}. Путь свежести продолжается.`
  };

}


/* STATE */

let currentMachine=null;
let allHistory={};
let finishing=false;

let phrase="";
let phraseMode="";
let phraseTime=0;


/* START */

document.getElementById("startWash")
.onclick=async()=>{

  const name=
    document.getElementById("user").value;

  const minutes=
    Number(document.getElementById("minutes").value);


  if(!name){
    alert("Сначала выбери имя 🙂");
    return;
  }


  if(
    "Notification" in window &&
    Notification.permission==="default"
  ){
    await requestNotifications();
  }


  const now=new Date();

  const finish=
    new Date(Date.now()+minutes*60000);


  if(
    finish.getDate()!==now.getDate() ||
    finish.getHours()>=23
  ){

    alert(
      "Эта стирка закончится после 23:00. Даже барабану нужен отдых 😴"
    );

    return;
  }


  const snap=
    await get(machineRef);

  const old=snap.val();


  if(old && old.endTime>Date.now()){

    alert("Поздно. На арене уже другой артист.");

    return;
  }


  const startTime=Date.now();


  await set(machineRef,{

    user:name,

    ownerDeviceId:deviceId,

    startTime,

    endTime:
      startTime+
      minutes*60000,

    minutes

  });

};


/* STOP */

document.getElementById("stopWash")
.onclick=async()=>{

  if(!currentMachine)return;


  if(
    currentMachine.ownerDeviceId !==
    deviceId
  )return;


  if(
    !confirm(
      "Точно закончил? Комиссия барабана всё зафиксирует 😄"
    )
  )return;


  await finishWash(
    currentMachine,
    "stopped"
  );

};


/* FINISH */

async function finishWash(wash,reason){

  if(finishing || !wash)return;

  finishing=true;


  if(reason==="timer")
    await notifyOwner(wash);


  const finished=Date.now();


  const previous=
    Object.values(allHistory)
      .filter(x=>x.user===wash.user);


  const number=
    previous.length+1;


  const award=
    awardFor(number);


  const actualMinutes=
    Math.max(
      1,
      Math.round(
        (finished-wash.startTime)/
        60000
      )
    );


  await set(
    ref(
      db,
      "history/"+
      wash.startTime
    ),
    {

      user:wash.user,

      started:wash.startTime,

      finished,

      plannedMinutes:
        wash.minutes,

      actualMinutes,

      reason,

      awardName:
        award.name,

      awardEmoji:
        award.emoji

    }
  );


  await set(
    awardRef,
    {
      user:wash.user,
      ...award,
      time:finished
    }
  );


  await remove(machineRef);


  celebrate();


  finishing=false;

}


/* MACHINE */

onValue(machineRef,s=>{

  currentMachine=s.val();

  phrase="";
  phraseMode="";
  phraseTime=0;

  renderMachine();

});


function renderMachine(){

  const busy=
    currentMachine &&
    currentMachine.endTime>Date.now();


  document
    .getElementById("statusBox")
    .classList.toggle(
      "busy",
      busy
    );


  document
    .getElementById("status")
    .textContent=
      busy
      ?"ЗАНЯТА"
      :"СВОБОДНА";


  document
    .getElementById("status")
    .className=
      busy
      ?"busyText"
      :"freeText";


  document
    .getElementById("freeArea")
    .classList.toggle(
      "hidden",
      busy
    );


  document
    .getElementById("busyArea")
    .classList.toggle(
      "hidden",
      !busy
    );


  document
    .getElementById("clothes")
    .classList.toggle(
      "spin",
      busy
    );


  if(!busy){

    document
      .getElementById("ring")
      .style.setProperty(
        "--progress",
        0
      );


    if(
      currentMachine &&
      currentMachine.endTime<=Date.now()
    ){

      finishWash(
        currentMachine,
        "timer"
      );

      return;

    }


    document
      .getElementById("freeMessage")
      .textContent=
        randomFrom(freePhrases);


    return;

  }


  document
    .getElementById("currentUser")
    .textContent=
      personal(
        currentMachine.user
      );


  const mine=
    currentMachine.ownerDeviceId ===
    deviceId;


  document
    .getElementById("stopWash")
    .classList.toggle(
      "hidden",
      !mine
    );


  document
    .getElementById("lockedStop")
    .classList.toggle(
      "hidden",
      mine
    );


  updateTimer();

}


/* TIMER */

function updateTimer(){

  if(!currentMachine)return;


  const left=
    currentMachine.endTime-
    Date.now();


  if(left<=0){

    finishWash(
      currentMachine,
      "timer"
    );

    return;

  }


  const seconds=
    Math.ceil(left/1000);

  const m=
    Math.floor(seconds/60);

  const s=
    seconds%60;


  document
    .getElementById("timer")
    .textContent=

      String(m).padStart(2,"0")
      +":"+
      String(s).padStart(2,"0");


  const total=
    currentMachine.minutes*
    60000;


  const progress=
    Math.max(
      0,
      Math.min(
        100,
        (
          (total-left)/
          total
        )*100
      )
    );


  document
    .getElementById("ring")
    .style.setProperty(
      "--progress",
      progress
    );


  document
    .getElementById("progressText")
    .textContent=

      `${Math.round(progress)}% номера уже позади`;


  let mode="normal";


  if(left<=3*60000)
    mode="panic";

  else if(left<=15*60000)
    mode="final";


  if(
    mode!==phraseMode ||
    !phrase ||
    Date.now()-phraseTime>
    18000
  ){

    const box=
      document.getElementById(
        "washMessage"
      );


    if(mode==="panic"){

      phrase=
        randomFrom(
          panicPhrases
        );

      box.className=
        "speech panic";

    }

    else if(mode==="final"){

      phrase=
        randomFrom(
          finalPhrases
        );

      box.className=
        "speech final";

    }

    else{

      phrase=
        randomFrom(
          washingPhrases
        );

      box.className=
        "speech";

    }


    box.textContent=phrase;

    phraseMode=mode;

    phraseTime=
      Date.now();

  }

}


setInterval(updateTimer,1000);


setInterval(()=>{

  if(!currentMachine){

    document
      .getElementById("freeMessage")
      .textContent=
      randomFrom(freePhrases);

  }

},20000);


/* QUEUE */

document.getElementById("joinQueue")
.onclick=async()=>{

  const name=
    document
      .getElementById("queueUser")
      .value;


  if(!name)return;


  const snap=
    await get(queueRef);

  const data=
    snap.val()||{};


  if(
    Object.values(data)
      .some(
        x=>x.user===name
      )
  ){

    alert("Ты уже в очереди.");

    return;
  }


  await push(
    queueRef,
    {
      user:name,
      time:Date.now(),
      ownerDeviceId:deviceId
    }
  );

};


onValue(queueRef,s=>{

  const data=s.val();

  const box=
    document.getElementById(
      "queue"
    );


  box.innerHTML="";


  const comment=
    document.getElementById(
      "queueComment"
    );


  if(!data){

    box.innerHTML=
      '<div class="muted">Очередь пустая. Даже немного подозрительно.</div>';

    comment.textContent="";

    return;

  }


  const items=
    Object.entries(data)
      .sort(
        (a,b)=>
        a[1].time-b[1].time
      );


  comment.textContent=
    items.length>1
    ?randomFrom(queuePhrases)
    :"Один артист ждёт следующего выхода.";


  items.forEach(
    ([key,item],i)=>{

      const row=
        document.createElement(
          "div"
        );


      row.className=
        "row queueRow";


      const mine=
        item.ownerDeviceId===
        deviceId;


      row.innerHTML=
        `
        <div>
          <span class="place">
            ${i+1}
          </span>
          <b>${item.user}</b>
        </div>

        <span class="muted">
          ${mine?"нажми — выйти":""}
        </span>
        `;


      if(mine){

        row.onclick=
          async()=>{

            if(
              confirm(
                "Выйти из очереди?"
              )
            ){

              await remove(
                ref(
                  db,
                  "queue/"+key
                )
              );

            }

          };

      }


      box.appendChild(row);

    }
  );

});


/* HISTORY */

onValue(historyRef,s=>{

  allHistory=
    s.val()||{};

  renderHistory();
  renderLeaders();

});


function renderHistory(){

  const box=
    document.getElementById(
      "history"
    );


  const items=
    Object.values(allHistory)
      .sort(
        (a,b)=>
        (b.finished||0)-
        (a.finished||0)
      )
      .slice(0,12);


  if(!items.length){

    box.innerHTML=
      '<div class="muted">Пока ни одного номера.</div>';

    return;
  }


  box.innerHTML="";


  items.forEach(item=>{

    const row=
      document.createElement(
        "div"
      );


    row.className="row";


    row.innerHTML=
      `
      <b>${item.user}</b>

      <div class="muted">
        ${new Date(item.finished)
          .toLocaleString("ru-RU")}
      </div>

      <span class="badge">
        ${item.awardEmoji||"🏆"}
        ${item.awardName||"Награда"}
      </span>
      `;


    box.appendChild(row);

  });

}


/* LEADERS */

function renderLeaders(){

  const users={};


  Object.values(allHistory)
    .forEach(x=>{

      if(!users[x.user])
        users[x.user]={
          washes:0,
          points:0
        };


      users[x.user].washes++;


      users[x.user].points+=
        100+
        Number(
          x.actualMinutes||
          x.plannedMinutes||
          0
        )+
        (
          x.reason==="timer"
          ?50
          :0
        );

    });


  const list=
    Object.entries(users)
      .sort(
        (a,b)=>
        b[1].points-
        a[1].points
      );


  const box=
    document.getElementById(
      "leaders"
    );


  if(!list.length){

    box.innerHTML=
      '<div class="muted">Чемпионат ещё не начался.</div>';

    return;

  }


  box.innerHTML="";


  list.forEach(
    ([name,x],i)=>{

      const row=
        document.createElement(
          "div"
        );


      row.className=
        "row leader";


      const rank=
        i===0?"👑":
        i===1?"🥈":
        i===2?"🥉":
        i+1;


      row.innerHTML=
        `
        <div class="rank">
          ${rank}
        </div>

        <div>
          <b>${name}</b>

          <div class="muted">
            ${x.washes} стирок
          </div>
        </div>

        <div class="xp">
          ${x.points} XP
        </div>
        `;


      box.appendChild(row);

    }
  );

}


/* AWARD */

onValue(awardRef,s=>{

  const a=s.val();

  const card=
    document.getElementById(
      "awardCard"
    );


  if(!a){

    card.classList.add(
      "hidden"
    );

    return;

  }


  card.classList.remove(
    "hidden"
  );


  document
    .getElementById("award")
    .innerHTML=

    `
    <div style="font-size:44px">
      ${a.emoji}
    </div>

    <div style="font-size:20px;font-weight:900">
      ${a.user}: ${a.name}
    </div>

    <div class="muted"
         style="margin-top:6px">
      ${a.desc}
    </div>
    `;

});


/* CELEBRATION */

function celebrate(){

  const icons=[
    "🎪","🫧","✨","🧦",
    "🦖","⚡","🤡","⭕"
  ];


  for(let i=0;i<28;i++){

    const el=
      document.createElement(
        "div"
      );


    el.className="fall";

    el.textContent=
      randomFrom(icons);


    el.style.left=
      Math.random()*100+
      "vw";


    el.style.fontSize=
      15+
      Math.random()*18+
      "px";


    el.style.animationDelay=
      Math.random()*.7+
      "s";


    document.body.appendChild(el);


    setTimeout(
      ()=>el.remove(),
      4000
    );

  }

}


/* INITIAL */

document.getElementById("freeMessage")
.textContent=
  randomFrom(freePhrases);

</script>
