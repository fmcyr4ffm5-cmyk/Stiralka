<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf8ff">
<title>Стиралка Fresh 6.0</title>

<style>
:root{
  --blue:#35a7ff;
  --blue2:#6fc8ff;
  --deep:#0876c9;
  --ice:#eaf8ff;
  --white:#ffffff;
  --ink:#16324a;
  --muted:#6b8aa0;
  --green:#19b66d;
  --red:#ef5350;
  --orange:#ff9f43;
  --border:rgba(42,145,210,.15);
  --shadow:0 18px 50px rgba(69,155,210,.15);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:var(--ink);

  background:
    radial-gradient(circle at 15% 5%, rgba(255,255,255,.98), transparent 30%),
    radial-gradient(circle at 85% 12%, rgba(185,232,255,.9), transparent 34%),
    linear-gradient(180deg,#e9f8ff 0%,#f8fdff 50%,#edfaff 100%);

  overflow-x:hidden;
}

.sky{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-1;
}

.cloud{
  position:absolute;
  color:white;
  opacity:.55;
  filter:blur(.2px);
  animation:cloudMove linear infinite;
}

.cloud.one{
  top:7%;
  left:-100px;
  font-size:72px;
  animation-duration:28s;
}

.cloud.two{
  top:31%;
  left:-150px;
  font-size:48px;
  animation-duration:38s;
  animation-delay:-15s;
}

.cloud.three{
  top:67%;
  left:-180px;
  font-size:62px;
  animation-duration:44s;
  animation-delay:-8s;
}

@keyframes cloudMove{
  from{transform:translateX(-160px)}
  to{transform:translateX(calc(100vw + 260px))}
}

.wrap{
  width:min(680px,100%);
  margin:auto;
  padding:20px 15px 70px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 3px 17px;
}

.logo{
  font-size:29px;
  font-weight:950;
  letter-spacing:-1px;
  color:#0b629d;
}

.version{
  font-size:11px;
  font-weight:850;
  letter-spacing:.6px;
  padding:7px 10px;
  border-radius:99px;
  color:#1683c7;
  background:rgba(255,255,255,.7);
  border:1px solid rgba(61,173,238,.2);
  backdrop-filter:blur(12px);
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  padding:21px;
  margin-bottom:15px;

  background:
    linear-gradient(145deg,rgba(255,255,255,.93),rgba(241,251,255,.82));

  border:1px solid rgba(255,255,255,.95);

  box-shadow:
    var(--shadow),
    inset 0 1px rgba(255,255,255,1);

  backdrop-filter:blur(18px);
}

.card:before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  background:rgba(113,204,255,.12);
  top:-80px;
  right:-60px;
}

.status{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
  margin-bottom:12px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px rgba(25,182,109,.55);
}

.busy .dot{
  background:var(--red);
  box-shadow:0 0 16px rgba(239,83,80,.5);
}

.freeText{color:var(--green)}
.busyText{color:var(--red)}

.machine-area{
  display:flex;
  justify-content:center;
  padding:4px 0 9px;
}

.machine{
  position:relative;
  width:190px;
  height:190px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.progressRing{
  position:absolute;
  inset:0;
  border-radius:50%;

  background:
    conic-gradient(
      #42baff calc(var(--progress,0) * 1%),
      rgba(77,174,230,.13) 0
    );

  box-shadow:
    0 12px 40px rgba(51,166,230,.16);

  transition:background .7s linear;
}

.progressRing:after{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;

  background:
    linear-gradient(145deg,#f9feff,#e4f7ff);

  box-shadow:
    inset 0 0 25px rgba(64,174,235,.1);
}

.drum{
  position:relative;
  z-index:2;
  width:142px;
  height:142px;
  border-radius:50%;

  overflow:hidden;

  border:8px solid rgba(94,194,246,.32);

  background:
    radial-gradient(circle at 32% 25%,#d9f5ff 0,#86d7ff 36%,#279bd6 72%,#1172ad 100%);

  box-shadow:
    inset 0 0 22px rgba(4,78,123,.22),
    0 10px 32px rgba(55,166,225,.2);
}

.water{
  position:absolute;
  left:-10%;
  bottom:-18%;
  width:120%;
  height:57%;
  border-radius:45% 55% 30% 30%;

  background:
    linear-gradient(180deg,rgba(255,255,255,.5),rgba(92,202,255,.78));

  animation:waterWave 3.5s ease-in-out infinite;
}

@keyframes waterWave{
  0%,100%{transform:rotate(-3deg) translateY(0)}
  50%{transform:rotate(4deg) translateY(-4px)}
}

.clothes{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;

  font-size:31px;
}

.clothes.spinning{
  animation:clothesSpin 4.2s linear infinite;
}

@keyframes clothesSpin{
  to{transform:rotate(360deg)}
}

.item{
  position:absolute;
  filter:drop-shadow(0 4px 5px rgba(0,70,110,.12));
}

.item.shirt{
  transform:translate(-26px,-28px) rotate(-15deg);
}

.item.underwear{
  transform:translate(31px,-3px) rotate(18deg);
}

.item.sock{
  transform:translate(-14px,35px) rotate(10deg);
}

.item.towel{
  transform:translate(29px,38px) rotate(-20deg);
  font-size:24px;
}

.bubble{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  animation:bubbleUp 3.4s ease-in infinite;
}

.bubble.b1{
  width:13px;height:13px;
  left:21px;bottom:15px;
}

.bubble.b2{
  width:8px;height:8px;
  left:52px;bottom:4px;
  animation-delay:-1.2s;
}

.bubble.b3{
  width:17px;height:17px;
  right:24px;bottom:12px;
  animation-delay:-2s;
}

.bubble.b4{
  width:9px;height:9px;
  right:53px;bottom:0;
  animation-delay:-.7s;
}

@keyframes bubbleUp{
  from{
    opacity:0;
    transform:translateY(20px) scale(.7);
  }
  30%{opacity:.8}
  to{
    opacity:0;
    transform:translateY(-110px) scale(1.15);
  }
}

.userTitle{
  text-align:center;
  font-size:22px;
  font-weight:950;
  letter-spacing:-.4px;
  color:#0a669f;
}

.timer{
  text-align:center;
  font-size:49px;
  font-weight:950;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
  color:#123f5e;
  margin:4px 0;
}

.progressText{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:12px;
}

.speech{
  min-height:73px;
  padding:14px 16px;
  border-radius:19px;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;
  line-height:1.4;
  font-size:16px;

  color:#23658c;

  background:
    linear-gradient(145deg,rgba(255,255,255,.92),rgba(222,246,255,.86));

  border:1px solid rgba(83,187,241,.19);

  box-shadow:
    inset 0 1px rgba(255,255,255,1);

  animation:speechPop .35s ease;
}

@keyframes speechPop{
  from{
    opacity:0;
    transform:translateY(6px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.speech.final{
  color:#976011;
  background:linear-gradient(145deg,#fffaf0,#fff1d7);
  border-color:rgba(255,170,44,.3);
}

.speech.panic{
  color:#bc3c39;
  background:linear-gradient(145deg,#fff6f5,#ffe7e5);
  border-color:rgba(239,83,80,.28);
  animation:softPulse 1.25s infinite;
}

@keyframes softPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.015)}
}

label{
  display:block;
  margin:16px 0 7px;
  font-size:14px;
  font-weight:800;
  color:#51778e;
}

select,button{
  width:100%;
  font:inherit;
  border-radius:17px;
}

select{
  appearance:none;
  padding:14px;
  color:#174968;

  background:
    linear-gradient(145deg,#fff,#f0faff);

  border:1px solid rgba(61,173,238,.2);

  outline:none;
}

button{
  border:none;
  padding:15px;
  margin-top:12px;

  font-weight:900;
  color:white;

  background:
    linear-gradient(135deg,#54c5ff,#168ddd);

  box-shadow:
    0 10px 25px rgba(42,159,224,.22);
}

button:active{
  transform:scale(.985);
}

.stop{
  background:
    linear-gradient(135deg,#ff7771,#e54743);

  box-shadow:
    0 10px 25px rgba(228,71,67,.18);
}

.stopLocked{
  color:#7391a3;
  background:#edf6fa;
  box-shadow:none;
  border:1px solid #d5eaf4;
}

.queueBtn{
  background:
    linear-gradient(135deg,#6dcaff,#338ee6);
}

.sectionTitle{
  position:relative;
  z-index:2;
  font-size:19px;
  font-weight:900;
  color:#155e89;
  margin-bottom:13px;
}

.hidden{
  display:none!important;
}

.row{
  padding:12px 2px;
  border-bottom:1px solid rgba(48,151,210,.1);
}

.row:last-child{
  border-bottom:none;
}

.muted{
  color:#7d9bad;
  font-size:13px;
}

.queueComment{
  text-align:center;
  color:#6f91a5;
  font-size:14px;
  padding:12px 0 2px;
}

.position{
  display:inline-flex;
  justify-content:center;
  align-items:center;

  width:28px;
  height:28px;
  border-radius:10px;

  margin-right:8px;

  font-size:13px;
  font-weight:900;

  color:#1973aa;
  background:#e4f6ff;
}

.queueRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.leader{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:10px;
  align-items:center;
}

.rank{
  width:39px;
  height:39px;
  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:14px;

  font-weight:900;

  color:#1472aa;
  background:#e2f5ff;
}

.rank.first{
  background:linear-gradient(145deg,#fff2a8,#ffc956);
  color:#9b6300;
}

.leaderName{
  font-weight:900;
  color:#145b83;
}

.points{
  font-weight:900;
  color:#168dcc;
}

.badge{
  display:inline-block;

  margin-top:5px;
  padding:5px 9px;

  border-radius:99px;

  font-size:11px;
  font-weight:800;

  color:#31779d;
  background:#ebf8ff;
  border:1px solid rgba(68,176,232,.14);
}

.levelbar{
  height:7px;
  overflow:hidden;
  border-radius:99px;
  background:#e2f3fa;
  margin-top:9px;
}

.levelbar div{
  height:100%;
  border-radius:99px;
  background:
    linear-gradient(90deg,#56c8ff,#0d91de);
}

.notice{
  text-align:center;
  margin-top:11px;
  font-size:12px;
  color:#87a4b4;
}

.award{
  text-align:center;
}

.awardEmoji{
  font-size:43px;
}

.awardName{
  font-size:20px;
  font-weight:950;
  color:#12618d;
}

.awardDesc{
  margin-top:7px;
  color:#7191a4;
  line-height:1.4;
}

.freshBurst{
  position:fixed;
  z-index:9999;
  top:-30px;
  pointer-events:none;
  animation:burstFall 3.2s linear forwards;
}

@keyframes burstFall{
  to{
    transform:translateY(110vh) rotate(540deg);
    opacity:.7;
  }
}
</style>
</head>

<body>

<div class="sky">
  <div class="cloud one">☁️</div>
  <div class="cloud two">☁️</div>
  <div class="cloud three">☁️</div>
</div>

<div class="wrap">

<div class="header">

<div class="card">

<div id="busyArea" class="hidden">

  <div id="progressText" class="progressText"></div>

  <div id="washMessage" class="speech"></div>

  <button id="stopWash" class="stop hidden">
    ⏹ Я ЗАКОНЧИЛ СТИРКУ

  <button id="foreignWash" class="stopLocked hidden" disabled>

</div>

</div>


<div id="awardCard" class="card hidden">

  <div class="sectionTitle">

  <div class="award">

    <div id="awardName" class="awardName"></div>

    <div id="awardDesc" class="awardDesc"></div>

  </div>

</div>


<div class="card">

<div class="sectionTitle">
  👥 Очередь на очищение
</div>

<select id="queueUser">
  <option value="">Выбрать имя</option>
  <option>Александр</option>
  <option>Анечка</option>
  <option>Наталия</option>
  <option>Ваня</option>
  <option>Виктор</option>
  <option>Дима</option>
  <option>Коля</option>
  <option>Леся</option>
  <option>Суримай</option>
  <option>Юра</option>
  <option>Каспер</option>
</select>

<button id="joinQueue" class="queueBtn">

</button>

<div id="queueComment" class="queueComment"></div>

<div id="queue"></div>

</div>


<div class="card">

<div class="sectionTitle">
  🏆 Зал свежей славы
</div>

<div id="leaders"></div>

</div>


<div class="card">

<div class="sectionTitle">

</div>

</div>

function awardFor(count){

  if(count>=100){
    return{
      emoji:"👑",
      name:"СУПЕР-БОСС СТИРКИ",
      desc:"100 стирок. Барабан официально признаёт твою власть."
    };
  }

  const n=Math.max(1,count);

  const a=
    Math.floor((n-1)/10);

  const b=
    (n-1)%10;

  return{
    emoji:awardEmojis[b],
    name:
      awardAdjectives[a]+
      " "+
      awardNouns[b],

    desc:
      "Награда №"+
      n+
      ". Ещё один шаг к абсолютной свежести."
  };

}


function pointsFor(item){

  let points=100;

  points+=
    Number(
      item.actualMinutes ||
      item.plannedMinutes ||
      0
    );

  if(item.reason==="timer"){
    points+=50;
  }

  return points;

}

/* ====================================
   FINISH
==================================== */

async function finishWash(
  wash,
  reason
){

  if(
    finishing ||
    !wash
  )return;


  finishing=true;


  const finished=
    Date.now();


  const actualMinutes=
    Math.max(
      1,
      Math.round(
        (
          finished -
          wash.startTime
        ) /
        60000
      )
    );


  const previous=
    Object.values(allHistory)
      .filter(
        x=>x.user===wash.user
      );


  const washNumber=
    previous.length+1;


  const award=
    awardFor(washNumber);


  const id=
    String(
      wash.startTime ||
      finished
    );


  await set(
    ref(
      db,
      "history/"+id
    ),
    {

      user:wash.user,

      started:
        wash.startTime,

      finished,

      plannedMinutes:
        wash.minutes,

      actualMinutes,

      reason,

      washNumber,

      awardName:
        award.name,

      awardEmoji:
        award.emoji

    }
  );


  await set(
    lastAwardRef,
    {

      user:wash.user,

      time:finished,

      washNumber,

      ...award

    }
  );


  await remove(machineRef);


  freshCelebration();


  finishing=false;

}

/* ====================================
   TIMER
==================================== */

function updateTimer(){

  if(!currentMachine)return;


  const remaining=
    currentMachine.endTime-
    Date.now();


  if(remaining<=0){

    finishWash(
      currentMachine,
      "timer"
    );

    return;

  }


  const seconds=
    Math.ceil(
      remaining/1000
    );


  const mins=
    Math.floor(
      seconds/60
    );


  const secs=
    seconds%60;


  document
    .getElementById("timer")
    .textContent=

      String(mins)
      .padStart(2,"0")
      +
      ":"
      +
      String(secs)
      .padStart(2,"0");


  const total=
    currentMachine.minutes*
    60000;


  const elapsed=
    total-
    remaining;


  const progress=
    Math.min(
      100,
      Math.max(
        0,
        elapsed/total*100
      )
    );


  document
    .getElementById("ring")
    .style
    .setProperty(
      "--progress",
      progress
    );


  document
    .getElementById("progressText")
    .textContent=

      Math.round(progress)+
      "% пути к абсолютной свежести";


  let mode=
    "washing";


  if(
    remaining<=
    3*60*1000
  ){

    mode="panic";

  }

  else if(
    remaining<=
    15*60*1000
  ){

    mode="final";

  }


  const now=
    Date.now();


  if(
    mode!==currentMode ||
    !currentPhrase ||
    now-lastPhraseChange>
    18000
  ){

    currentMode=
      mode;


    const box=
      document.getElementById(
        "washMessage"
      );


    if(mode==="panic"){

      currentPhrase=
        randomFrom(
          panicPhrases
        );

      box.className=
        "speech panic";

    }

    else if(
      mode==="final"
    ){

      currentPhrase=
        randomFrom(
          finalPhrases
        );

      box.className=
        "speech final";

    }

    else{

      currentPhrase=
        randomFrom(
          washingPhrases
        );

      box.className=
        "speech";

    }


    box.textContent=
      currentPhrase;


    lastPhraseChange=
      now;

  }

}

function renderHistory(){

  const box=
    document.getElementById(
      "history"
    );


  const items=
    Object.values(
      allHistory
    )
    .sort(
      (a,b)=>
        (b.finished||0)-
        (a.finished||0)
    )
    .slice(0,12);


  if(!items.length){

    box.innerHTML=
      '<div class="muted">История пока чиста.</div>';

    return;

  }


  box.innerHTML="";


  items.forEach(
    item=>{

      const row=
        document.createElement(
          "div"
        );


      row.className=
        "row";


      const date=
        new Date(
          item.finished
        )
        .toLocaleString(
          "ru-RU"
        );


      const note=
        item.reason==="stopped"
        ?
        " · закончил раньше"
        :
        " · выдержал до конца 🫡";


      row.innerHTML=
        `
        <b>${item.user}</b>

        <div class="muted">
          ${date}${note}
        </div>

        <span class="badge">
          ${item.awardEmoji||"🏆"}
          ${item.awardName||"Награда"}
        </span>
        `;


      box.appendChild(row);

    }
  );

}


function renderLeaders(){

  const users={};


  Object.values(
    allHistory
  )
  .forEach(
    item=>{

      if(!item.user)return;


      if(
        !users[item.user]
      ){

        users[item.user]={
          washes:0,
          minutes:0,
          points:0
        };

      }


      const user=
        users[item.user];


      user.washes++;


      user.minutes+=
        Number(
          item.actualMinutes||
          item.plannedMinutes||
          0
        );


      user.points+=
        pointsFor(item);

    }
  );


  const ranking=
    Object.entries(users)
      .sort(
        (a,b)=>
          b[1].points-
          a[1].points
      );


  const box=
    document.getElementById(
      "leaders"
    );


  if(!ranking.length){

    box.innerHTML=
      '<div class="muted">Чемпионат свежести ещё не начался.</div>';

    return;

  }


  box.innerHTML="";


  ranking.forEach(
    ([name,data],i)=>{

      const award=
        awardFor(
          data.washes
        );


      const row=
        document.createElement(
          "div"
        );


      row.className=
        "row leader";


      let place=i+1;

      if(i===0)place="👑";
      if(i===1)place="🥈";
      if(i===2)place="🥉";


      row.innerHTML=
        `
        <div class="rank ${i===0?"first":""}">
          ${place}
        </div>

        <div>

          <div class="leaderName">
            ${name}
          </div>

          <div class="muted">
            ${data.washes} стирок ·
            ${data.minutes} минут
          </div>

          <span class="badge">
            ${award.emoji}
            ${award.name}
          </span>

          <div class="levelbar">
            <div
              style="width:${Math.min(100,data.washes)}%">
            </div>
          </div>

        </div>

        <div class="points">
          ${data.points} XP
        </div>
        `;


      box.appendChild(
        row
      );

    }
  );

}

  }
);


/* ====================================
   FRESH CELEBRATION
==================================== */

function freshCelebration(){

  const pieces=[
    "🫧",
    "✨",
    "☁️",
    "🧦",
    "👕",
    "🩲",
    "💧"
  ];


  for(
    let i=0;
    i<30;
    i++
  ){

    const el=
      document.createElement(
        "div"
      );


    el.className=
      "freshBurst";


    el.textContent=
      randomFrom(
        pieces
      );


    el.style.left=
      Math.random()*
      100+
      "vw";


    el.style.fontSize=
      (
        15+
        Math.random()*18
      )+
      "px";


    el.style.animationDelay=
      Math.random()*
      .7+
      "s";


    document.body.appendChild(
      el
    );


    setTimeout(
      ()=>el.remove(),
      4200
    );

  }

}

==================================== */

document
.getElementById("freeMessage")
.textContent=
  randomFrom(freePhrases);
