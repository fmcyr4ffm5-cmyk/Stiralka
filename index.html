<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Стиралка 5.0</title>

<style>
:root{
  --bg:#09090b;
  --card:#151518;
  --card2:#1c1c21;
  --text:#fafafa;
  --muted:#9898a2;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#f59e0b;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --border:rgba(255,255,255,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,#27273a 0,transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  min-height:100vh;
}

.wrap{
  width:min(680px,100%);
  margin:auto;
  padding:22px 15px 70px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 3px 22px;
}

.logo{
  font-size:31px;
  font-weight:900;
  letter-spacing:-1px;
}

.version{
  font-size:12px;
  padding:7px 10px;
  border-radius:99px;
  background:rgba(139,92,246,.15);
  color:#c4b5fd;
  border:1px solid rgba(139,92,246,.3);
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#18181c,#111114);
  border:1px solid var(--border);
  border-radius:27px;
  padding:21px;
  margin-bottom:15px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.03);
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.8px;
  margin-bottom:14px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 15px var(--green);
}

.busy .dot{
  background:var(--red);
  box-shadow:0 0 15px var(--red);
}

.busyText{color:#f87171}
.freeText{color:#4ade80}

.machine-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:4px 0 5px;
}

.machine{
  width:170px;
  height:170px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:3px auto 7px;
}

.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(
      var(--purple) calc(var(--progress,0) * 1%),
      rgba(255,255,255,.07) 0
    );
  transition:background .8s linear;
}

.ring:after{
  content:"";
  position:absolute;
  inset:9px;
  background:#111114;
  border-radius:50%;
}

.drum{
  z-index:2;
  width:128px;
  height:128px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,#3f3f46,#111 56%,#060606);
  border:7px solid #303038;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 24px #000,
    0 0 35px rgba(139,92,246,.08);
}

.drum.spinning{
  animation:spin 4s linear infinite;
}

.bubble{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}

.b1{width:18px;height:18px;left:28px;top:30px}
.b2{width:11px;height:11px;right:33px;top:51px}
.b3{width:24px;height:24px;right:45px;bottom:23px}
.b4{width:13px;height:13px;left:38px;bottom:31px}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.025)}
}

@keyframes pop{
  from{opacity:0;transform:translateY(10px) scale(.96)}
  to{opacity:1;transform:none}
}

@keyframes shine{
  from{background-position:-200% center}
  to{background-position:200% center}
}

.user-title{
  font-size:23px;
  font-weight:900;
  text-align:center;
  letter-spacing:-.4px;
}

.timer{
  font-size:45px;
  font-weight:950;
  text-align:center;
  font-variant-numeric:tabular-nums;
  margin:3px 0 5px;
  letter-spacing:-1px;
}

.progress-caption{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  margin-bottom:13px;
}

.speech{
  background:linear-gradient(145deg,#222229,#18181d);
  border:1px solid var(--border);
  min-height:73px;
  border-radius:19px;
  padding:14px 16px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  line-height:1.4;
  font-size:16px;
  animation:pop .3s ease;
}

.speech.final{
  border-color:rgba(245,158,11,.45);
  background:linear-gradient(145deg,#2b2111,#191713);
}

.speech.panic{
  border-color:rgba(239,68,68,.5);
  background:linear-gradient(145deg,#351515,#1c1212);
  animation:pulse 1s infinite;
}

select,button{
  width:100%;
  font:inherit;
  border-radius:16px;
}

select{
  color:var(--text);
  background:#202026;
  border:1px solid var(--border);
  padding:14px;
  outline:none;
}

label{
  display:block;
  color:#d4d4d8;
  font-size:14px;
  font-weight:700;
  margin:16px 0 7px;
}

button{
  border:none;
  padding:15px;
  font-weight:850;
  margin-top:12px;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  box-shadow:0 8px 25px rgba(79,70,229,.25);
}

button:active{transform:scale(.98)}

.stop{
  background:linear-gradient(135deg,#dc2626,#991b1b);
  box-shadow:0 8px 25px rgba(220,38,38,.18);
}

.queueBtn{
  background:linear-gradient(135deg,#2563eb,#4338ca);
}

.hidden{display:none!important}

.section-title{
  font-size:19px;
  font-weight:850;
  margin-bottom:14px;
}

.queueComment{
  color:#a1a1aa;
  text-align:center;
  font-size:14px;
  margin:13px 0 4px;
}

.row{
  padding:12px 2px;
  border-bottom:1px solid var(--border);
}

.row:last-child{border-bottom:none}

.queueRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.position{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  width:27px;
  height:27px;
  border-radius:9px;
  background:#27272a;
  margin-right:8px;
  font-size:13px;
  font-weight:800;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.leader{
  display:grid;
  grid-template-columns:42px 1fr auto;
  align-items:center;
  gap:10px;
}

.rank{
  width:39px;
  height:39px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#242429;
  border-radius:13px;
  font-weight:900;
}

.rank.first{
  background:linear-gradient(145deg,#713f12,#a16207);
}

.leaderName{
  font-weight:820;
}

.points{
  color:#c4b5fd;
  font-weight:850;
}

.badge{
  display:inline-block;
  background:#28282e;
  border:1px solid var(--border);
  border-radius:99px;
  padding:5px 9px;
  margin-top:5px;
  color:#d4d4d8;
  font-size:11px;
}

.award-card{
  border:1px solid rgba(245,158,11,.25);
  background:
    radial-gradient(circle at top right,rgba(245,158,11,.12),transparent 45%),
    #171719;
}

.award-big{
  font-size:42px;
  text-align:center;
  margin-bottom:5px;
}

.award-name{
  font-size:20px;
  text-align:center;
  font-weight:900;
}

.award-desc{
  text-align:center;
  color:#a1a1aa;
  line-height:1.4;
  margin-top:7px;
}

.levelbar{
  background:#29292e;
  height:7px;
  overflow:hidden;
  border-radius:99px;
  margin-top:13px;
}

.levelbar>div{
  height:100%;
  background:linear-gradient(90deg,#7c3aed,#f59e0b);
  border-radius:99px;
}

.superboss{
  background:
    linear-gradient(90deg,#fde68a,#f97316,#d946ef,#8b5cf6,#fde68a);
  background-size:200%;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 3s linear infinite;
}

.notice{
  color:#a1a1aa;
  font-size:12px;
  text-align:center;
  margin-top:13px;
}

.confetti{
  position:fixed;
  top:-20px;
  z-index:9999;
  pointer-events:none;
  animation:fall 2.8s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:.8;
  }
}
</style>
</head>

</div>


<div class="card">

<div class="card">

}

function personPhrase(name){
  return randomFrom(personTemplates).replaceAll("{name}",name);

function awardFor(count){

  if(count >= 100){
    return {
      emoji:"👑",
      name:"СУПЕР-БОСС СТИРКИ",
      desc:"100 стирок. Барабан признаёт твою власть. Дальше только легенды."
    };
  }

  const number=Math.max(1,count);

  const a=Math.floor((number-1)/10);
  const b=(number-1)%10;

  const specialDescriptions=[
    "Путь начинается с одного чистого носка.",
    "Порошок впервые запомнил твоё имя.",
    "Барабан начинает относиться к тебе серьёзно.",
    "Грязь уже узнаёт тебя издалека.",
    "Ты официально часть стиральной системы.",
    "Уровень бытовой ответственности повышен.",
    "Центрифуга одобрительно кивает.",
    "Тазик начинает испытывать уважение.",
    "Министерство чистоты следит за карьерой.",
    "Ещё немного — и барабан попросит автограф."
  ];

  return {
    emoji:awardEmojis[b],
    name:`${awardAdjectives[a]} ${awardNouns[b]}`,
    desc:`Награда №${number}. ${specialDescriptions[b]}`
  };

}


/* ==========================================
   GAME POINTS
========================================== */

function pointsFor(item){

  const minutes=
    Number(item.actualMinutes || item.plannedMinutes || 0);

  let points=100;

  points+=Math.min(minutes,120);

  if(item.reason==="timer"){
    points+=50;
  }

  return points;
}


/* ==========================================
   STATE
========================================== */

let currentMachine=null;
let finishing=false;
let currentMode="";
let currentPhrase="";
let lastPhraseChange=0;
let allHistory={};


/* ==========================================
   START WASH
========================================== */

document.getElementById("startWash").onclick=async()=>{

  const name=document.getElementById("user").value;
  const minutes=Number(document.getElementById("minutes").value);

  if(!name){
    alert("Сначала представься, герой.");
    return;
  }

  const now=new Date();

  if(now.getHours()>=23){
    alert("После 23:00 барабан официально ушёл с работы 😴");
    return;
  }

  const projected=new Date(Date.now()+minutes*60000);

  if(projected.getDate()!==now.getDate() || projected.getHours()>=23){
    alert("Эта стирка закончится после 23:00. Профсоюз барабана против.");
    return;
  }

  const snap=await get(machineRef);
  const existing=snap.val();

  if(existing && existing.endTime>Date.now()){
    alert("Поздно. Барабан уже состоит в отношениях с другим бельём.");
    return;
  }

  const startTime=Date.now();

  await set(machineRef,{
    user:name,
    startTime,
    endTime:startTime+minutes*60000,
    minutes
  });

};


/* ==========================================
   STOP
========================================== */

document.getElementById("stopWash").onclick=async()=>{

  if(!currentMachine)return;

  const yes=confirm(
    "Точно всё? Комиссия зафиксирует досрочный выход 😄"
  );

  if(!yes)return;

  await finishWash(currentMachine,"stopped");
};


/* ==========================================
   FINISH
========================================== */

async function finishWash(wash,reason){

  if(finishing || !wash)return;

  finishing=true;

  const finished=Date.now();

  const actualMinutes=
    Math.max(
      1,
      Math.round(
        (finished-wash.startTime)/60000
      )
    );

  const existingUserHistory=
    Object.values(allHistory)
      .filter(x=>x.user===wash.user);

  const washNumber=
    existingUserHistory.length+1;

  const award=awardFor(washNumber);

  const historyId=
    String(wash.startTime || finished);

  await set(
    ref(db,"history/"+historyId),
    {
      user:wash.user,
      started:wash.startTime,
      finished,
      plannedMinutes:wash.minutes,
      actualMinutes,
      reason,
      washNumber,
      awardName:award.name,
      awardEmoji:award.emoji
    }
  );

  await set(lastAwardRef,{
    user:wash.user,
    time:finished,
    washNumber,
    ...award
  });

  await remove(machineRef);

  confetti();

  finishing=false;
}


/* ==========================================
   FIREBASE MACHINE
========================================== */

onValue(machineRef,snapshot=>{

  currentMachine=snapshot.val();

  currentMode="";
  currentPhrase="";
  lastPhraseChange=0;

  renderMachine();

});


function renderMachine(){

  const statusBox=document.getElementById("statusBox");
  const status=document.getElementById("status");
  const freeArea=document.getElementById("freeArea");
  const busyArea=document.getElementById("busyArea");
  const drum=document.getElementById("drum");

  if(!currentMachine || currentMachine.endTime<=Date.now()){

    statusBox.classList.remove("busy");
    status.textContent="СВОБОДНА";
    status.className="freeText";

    freeArea.classList.remove("hidden");
    busyArea.classList.add("hidden");

    drum.classList.remove("spinning");

    document.getElementById("ring")
      .style.setProperty("--progress",0);

    if(currentMachine){
      finishWash(currentMachine,"timer");
      return;
    }

    document.getElementById("freeMessage").textContent=
      randomFrom(freePhrases);

    return;
  }

  statusBox.classList.add("busy");
  status.textContent="ЗАНЯТА";
  status.className="busyText";

  freeArea.classList.add("hidden");
  busyArea.classList.remove("hidden");

  drum.classList.add("spinning");

  document.getElementById("currentUser").textContent=
    personPhrase(currentMachine.user);

  updateTimer();
}


/* ==========================================
   TIMER
========================================== */

function updateTimer(){

  if(!currentMachine)return;

  const remaining=
    currentMachine.endTime-Date.now();

  if(remaining<=0){
    finishWash(currentMachine,"timer");
    return;
  }

  const totalSeconds=Math.ceil(remaining/1000);
  const mins=Math.floor(totalSeconds/60);
  const secs=totalSeconds%60;

  document.getElementById("timer").textContent=
    String(mins).padStart(2,"0")+
    ":"+
    String(secs).padStart(2,"0");


  const total=
    currentMachine.minutes*60000;

  const elapsed=
    total-remaining;

  const progress=
    Math.min(
      100,
      Math.max(0,(elapsed/total)*100)
    );

  document.getElementById("ring")
    .style.setProperty("--progress",progress);


  document.getElementById("progressCaption").textContent=
    `${Math.round(progress)}% великого пути пройдено`;


  let mode="washing";

  if(remaining<=3*60*1000){
    mode="panic";
  }
  else if(remaining<=15*60*1000){
    mode="final";
  }


  const box=
    document.getElementById("washMessage");

  const now=Date.now();

  if(
    mode!==currentMode ||
    !currentPhrase ||
    now-lastPhraseChange>18000
  ){

    currentMode=mode;

    if(mode==="panic"){

      currentPhrase=randomFrom(panicPhrases);
      box.className="speech panic";

    }
    else if(mode==="final"){

      currentPhrase=randomFrom(finalPhrases);
      box.className="speech final";

    }
    else{

      currentPhrase=randomFrom(washingPhrases);
      box.className="speech";

    }

    box.textContent=currentPhrase;

    lastPhraseChange=now;
  }

}

setInterval(updateTimer,1000);


/* меняем приглашение свободной машинки */

setInterval(()=>{

    document.getElementById("freeMessage").textContent=
      randomFrom(freePhrases);

document.getElementById("joinQueue").onclick=async()=>{

  const name=
    document.getElementById("queueUser").value;

  if(!name){
    alert("Сначала выбери себя.");
    return;
  }

  const snap=await get(queueRef);
  const data=snap.val()||{};

  if(
    Object.values(data)
      .some(x=>x.user===name)
  ){
    alert("Ты уже в очереди. Система всё помнит 👀");
    return;
  }

  await push(queueRef,{

  });

};


onValue(queueRef,snapshot=>{

  const data=snapshot.val();
  const queue=document.getElementById("queue");

  queue.innerHTML="";

  if(!data){

    queue.innerHTML=
      '<div class="muted">Очередь пуста. Редкий момент социальной гармонии.</div>';

    document.getElementById("queueComment").textContent="";

    return;
  }

  const items=
    Object.entries(data)
      .sort((a,b)=>a[1].time-b[1].time);

  if(items.length>1){

    document.getElementById("queueComment").textContent=
      randomFrom(queuePhrases);

  }else{

    document.getElementById("queueComment").textContent=
      "Один человек ждёт. Пока без революции.";

  }

  items.forEach(([key,item],i)=>{

    const row=document.createElement("div");
    row.className="row queueRow";

    row.innerHTML=
      `<div>
        <span class="position">${i+1}</span>
        <b>${item.user}</b>
       </div>
       <span class="muted">нажал — убрать</span>`;

    row.onclick=async()=>{

      if(confirm(`Убрать ${item.user} из очереди?`)){
        await remove(ref(db,"queue/"+key));
      }

    };

    queue.appendChild(row);

  });

});


/* ==========================================
   HISTORY + LEADERBOARD
========================================== */

onValue(historyRef,snapshot=>{

  allHistory=snapshot.val()||{};

  renderHistory();
  renderLeaders();

});


function renderHistory(){

  const box=document.getElementById("history");

  const items=
    Object.values(allHistory)
      .sort((a,b)=>(b.finished||0)-(a.finished||0))
      .slice(0,12);

  if(!items.length){

    box.innerHTML=
      '<div class="muted">История пока молчит. Подозрительно.</div>';

    return;
  }

  box.innerHTML="";

  items.forEach(item=>{

    const row=document.createElement("div");
    row.className="row";

    const date=
      new Date(item.finished)
        .toLocaleString("ru-RU");

    const note=
      item.reason==="stopped"
        ?" · сбежал раньше 🏃"
        :" · выдержал до конца 🫡";

    row.innerHTML=
      `<b>${item.user}</b>
       <div class="muted">
       ${date}${note}
       </div>
       <span class="badge">
       ${item.awardEmoji||"🏆"}
       ${item.awardName||"Награда"}
       </span>`;

    box.appendChild(row);

  });

}


function renderLeaders(){

  const users={};

  Object.values(allHistory).forEach(item=>{

    if(!item.user)return;

    if(!users[item.user]){

      users[item.user]={
        washes:0,
        minutes:0,
        points:0,
        stops:0
      };

    }

    const u=users[item.user];

    u.washes++;
    u.minutes+=Number(
      item.actualMinutes ||
      item.plannedMinutes ||
      0
    );

    u.points+=pointsFor(item);

    if(item.reason==="stopped"){
      u.stops++;
    }

  });


  const ranking=
    Object.entries(users)
      .sort((a,b)=>b[1].points-a[1].points);


  const box=
    document.getElementById("leaders");

  if(!ranking.length){

    box.innerHTML=
      '<div class="muted">Соревнование ещё не началось.</div>';

    return;
  }

  box.innerHTML="";

  ranking.forEach(([name,data],i)=>{

    const award=
      awardFor(data.washes);

    const row=
      document.createElement("div");

    row.className="row leader";

    const medal=
      i===0?"👑":
      i===1?"🥈":
      i===2?"🥉":
      i+1;

    row.innerHTML=
      `
      <div class="rank ${i===0?"first":""}">
        ${medal}
      </div>

      <div>
        <div class="leaderName">
          ${name}
        </div>

        <div class="muted">
          ${data.washes} стирок ·
          ${data.minutes} мин
        </div>

        <span class="badge ${data.washes>=100?"superboss":""}">
          ${award.emoji} ${award.name}
        </span>

        <div class="levelbar">
          <div style="width:${Math.min(100,data.washes)}%"></div>
        </div>
      </div>

      <div class="points">
        ${data.points} XP
      </div>
      `;

    box.appendChild(row);

  });

}


/* ==========================================
   LAST AWARD
========================================== */

onValue(lastAwardRef,snapshot=>{

  const award=snapshot.val();

  const card=
    document.getElementById("awardCard");

  if(!award){

    card.classList.add("hidden");
    return;
  }

  card.classList.remove("hidden");

  document.getElementById("awardEmoji").textContent=
    award.emoji;

  document.getElementById("awardName").textContent=
    `${award.user}: ${award.name}`;

  document.getElementById("awardDesc").textContent=
    award.desc;

});


/* ==========================================
   CONFETTI
========================================== */

function confetti(){

  const pieces=["✨","🫧","🧦","🎉","🏆","🧺"];

  for(let i=0;i<24;i++){

    const el=document.createElement("div");

    el.className="confetti";
    el.textContent=randomFrom(pieces);

    el.style.left=
      Math.random()*100+"vw";

    el.style.fontSize=
      (15+Math.random()*18)+"px";

    el.style.animationDelay=
      Math.random()*.8+"s";

    document.body.appendChild(el);

    setTimeout(
      ()=>el.remove(),
      4000
    );

  }

}


/* ==========================================
   INITIAL
========================================== */

document.getElementById("freeMessage").textContent=
  randomFrom(freePhrases);
